<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .container{
            width: 1000px;
            height: 1000px;
            padding: 20px;
            position: relative;
            margin: auto;
            border: 1px solid black;
        }
       
        .gallery{
            width: 800px;
            height: 800px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            position: relative;
            justify-content: space-around;
            border: 1px solid black;
            flex-wrap: wrap;
            
        }
        .card>img{
            border-radius: 45px;
           
        }
        .mainimg{
            width: 10%;
            height: 10%;
            border: 1px solid black;
            display: none;
            transition: all 2s ease;
            
        }
       
        .open{
            width: 100%;
            height: 100%;
            display: block !important;
            position: absolute; 
            top: 0;
            left: 0;
        }
        #btn{
            width: 50px;
            height: 30px;
            display: none;
            background-color: yellow;
            position: absolute;
            top: 0;
            left:90%;
           
        }
        
    </style>
</head>
<body>
<div class="container"> 
    <div class="gallery">
            <div class="card">
                <img src="https://img.freepik.com/premium-photo/photo-evening-nature-landscape-with-river-lake-view-beautiful-trees_763111-93158.jpg?w=2000" alt="" width="200" height="200" >
            </div>
            <div class="card">
                <img src="https://image.cnbcfm.com/api/v1/image/107196242-1676618025305-W_Kent_Williamson_.jpg?v=1676635561&w=1920&h=1080" alt="" width="200" height="200">
            </div>
            <div class="card">
                  <img src="https://img.freepik.com/premium-photo/beautiful-evening-landscape-with-river-flowers_920758-3894.jpg?w=2000" alt="" width="200" height="200" >
            </div>
            <div class="card">
                <img src="https://images.pexels.com/photos/775070/pexels-photo-775070.jpeg?auto=compress&cs=tinysrgb&dpr=3&h=750&w=1260" alt="" width="200" height="200" >
            </div>
            <div class="card">
                <img src="https://image.cnbcfm.com/api/v1/image/107196242-1676618025305-W_Kent_Williamson_.jpg?v=1676635561&w=1920&h=1080" alt="" width="200" height="200">
            </div>
            <div class="card">
                <img src="https://img.freepik.com/premium-photo/beautiful-evening-landscape-with-river-flowers_920758-3894.jpg?w=2000" alt="" width="200" height="200" >
            </div>
            <div class="card">
                 <img src="https://img.freepik.com/premium-photo/photo-evening-nature-landscape-with-river-lake-view-beautiful-trees_763111-93158.jpg?w=200" alt=""    width="200" height="200" >
            </div>
            <div class="card">
                <img src="https://image.cnbcfm.com/api/v1/image/107196242-1676618025305-W_Kent_Williamson_.jpg?v=1676635561&w=1920&h=1080" alt="" width="200" height="200" >
            </div>
            <div class="card">
                <img src="https://img.freepik.com/premium-photo/beautiful-evening-landscape-with-river-flowers_920758-3894.jpg?w=2000" alt="" width="200" height="200" >
            </div>
            
    </div>    
    <div class="mainimg">
        <img src="" alt="" width="100%" height="100%">
        <button id="btn">close</button>
    </div>
</div>

    <script>
       var cards = document.querySelectorAll(".card img");
        console.log(cards);
        var mainimg = document.querySelector(".mainimg");
        console.log(mainimg)
       var maincard = document.querySelector(".mainimg img");
       var btn = document.querySelector("#btn");
       for(let data of cards){
            console.log(data)
           data.addEventListener("click", function(event){
                console.log(event.target.src)
               maincard.src = event.target.src
               mainimg.classList.add("open") 
               btn.classList.add("open")
           })
       }
        btn.addEventListener("click", function(event){
           mainimg.classList.remove("open")
           btn.classList.remove("open")
      })
    </script>
</body>
</html>
